name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install dependencies
        working-directory: ts
        # OpenTUI's Linux bundle references both libc variants at build time.
        run: bun install --frozen-lockfile --libc='*'
      - name: Type-check and test
        working-directory: ts
        run: |
          bunx tsc --noEmit
          bun test
      - name: Compile standalone binary
        working-directory: ts
        run: |
          bun build --compile --minify src/index.ts src/tui/sample-worker.ts \
            --outfile dist/sloppytop \
            --define "__INCUR_BINARY_NAME__=\"sloppytop\"" \
            --define "__INCUR_BINARY_TARGET__=\"linux-x64-glibc-baseline\"" \
            --define "__INCUR_BINARY_VERSION__=\"ci\""
      - name: Smoke
        working-directory: ts
        run: |
          ./dist/sloppytop --help
          ./dist/sloppytop --help | grep -F "process monitor screen"
      - name: Screen starts
        working-directory: ts
        run: python3 smoke-tui.py ./dist/sloppytop
      - uses: actions/upload-artifact@v4
        with:
          name: sloppytop-linux-amd64
          path: ts/dist/sloppytop
